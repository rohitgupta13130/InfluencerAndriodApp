<ion-content fullscreen="true" class="login-bg">

  <div class="login-container">
    <div class="login-card">

      <!-- Header -->
      <div class="logo-area">
        <h1 class="brand">
          <span class="blue">Influencer</span>
          <span class="pink">Connect</span>
        </h1>
        <h2>Welcome Back 👋</h2>
        <p>Find the perfect influencer</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="form-compact">

        <!-- Username -->
        <ion-item class="input-box"
          [class.invalid]="f['username'].touched && f['username'].invalid">

          <ion-icon name="mail-outline" slot="start"></ion-icon>

          <ion-input
            placeholder="Email or Phone"
            formControlName="username">
          </ion-input>

        </ion-item>

        <p class="error" *ngIf="f['username'].touched && f['username'].invalid">
          Enter valid username
        </p>

        <!-- Password -->
        <ion-item class="input-box"
          [class.invalid]="f['password'].touched && f['password'].invalid">

          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>

          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Password"
            formControlName="password">
          </ion-input>

          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            (click)="togglePassword()">
          </ion-icon>

        </ion-item>

        <p class="error" *ngIf="f['password'].touched && f['password'].invalid">
          Password must be at least 5 characters
        </p>

        <!-- API Error -->
        <p class="error" *ngIf="loginError">
          {{ loginError }}
        </p>

        <!-- Forgot -->
        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>

        <!-- Button -->
        <ion-button expand="block" class="login-btn" type="submit">
          {{ isSubmitting ? 'Logging in...' : 'Login' }}
        </ion-button>

        <!-- Divider -->
        <div class="divider">
          <span>OR</span>
        </div>

        <!-- Social -->
        <ion-button expand="block" fill="outline" class="google-btn">
          <ion-icon name="logo-google" slot="start"></ion-icon>
          Continue with Google
        </ion-button>

        <ion-button expand="block" class="facebook-btn">
          <ion-icon name="logo-facebook" slot="start"></ion-icon>
          Continue with Facebook
        </ion-button>

        <!-- Signup -->
        <div class="signup">
          <p>New here?</p>
          <ion-button fill="clear" (click)="goRegister()">
            Create Account
          </ion-button>
        </div>

      </form>

    </div>
  </div>

</ion-content>
