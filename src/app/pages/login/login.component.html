<ion-content fullscreen="true" class="login-bg">

  <div class="login-container">

    <div class="login-card">

      <div class="logo-area">
        <h1 class="brand">
          <span class="blue">Influencer</span>
          <span class="pink">Connect</span>
        </h1>

        <h2>Welcome Back 👋</h2>
        <p>Find the perfect influencer</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <!-- Username -->
        <ion-item class="input-box">
          <ion-icon name="mail-outline" slot="start"></ion-icon>

          <ion-input
            placeholder="Email or Phone"
            formControlName="username">
          </ion-input>
        </ion-item>

        <!-- Username Error -->
        <p class="error" *ngIf="f['username'].touched && f['username'].invalid">
          <span *ngIf="f['username'].errors?.['required']">Username is required</span>
          <span *ngIf="f['username'].errors?.['minlength']">Minimum 3 characters required</span>
        </p>

        <!-- Password -->
        <ion-item class="input-box">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>

          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Password"
            formControlName="password">
          </ion-input>

          <!-- 👁️ Toggle -->
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            (click)="togglePassword()"
            style="cursor:pointer;">
          </ion-icon>
        </ion-item>

        <!-- Password Error -->
        <p class="error" *ngIf="f['password'].touched && f['password'].invalid">
          <span *ngIf="f['password'].errors?.['required']">Password is required</span>
          <span *ngIf="f['password'].errors?.['minlength']">Minimum 5 characters required</span>
        </p>

        <!-- API Error -->
        <p class="error" *ngIf="loginError">
          {{ loginError }}
        </p>

        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>

        <!-- Button -->
        <ion-button
          expand="block"
          class="login-btn"
          type="submit"
          [disabled]="loginForm.invalid || isSubmitting">

          <span *ngIf="!isSubmitting">Login</span>
          <span *ngIf="isSubmitting">Logging in...</span>

        </ion-button>

        <div class="divider">
          <span>OR</span>
        </div>

        <ion-button expand="block" fill="outline" class="google-btn">
          <ion-icon name="logo-google" slot="start"></ion-icon>
          Continue with Google
        </ion-button>

        <ion-button expand="block" class="facebook-btn">
          <ion-icon name="logo-facebook" slot="start"></ion-icon>
          Continue with Facebook
        </ion-button>

        <div class="signup">
          <p>New here?</p>
          <ion-button fill="clear" (click)="goRegister()">
            Create Account
          </ion-button>
        </div>

      </form>

    </div>

  </div>

</ion-content>
